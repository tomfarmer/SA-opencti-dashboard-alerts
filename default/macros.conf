# Returns the alerts index name (easy to swap later if needed)
[opencti_alerts_index]
definition = opencti_alerts
iseval = 0

# Wraps collect so searches don't hardcode the index
# Usage: `m_collect_opencti_alerts("sourcetype","marker")`
[m_collect_opencti_alerts(2)]
args = sourcetype, marker
definition = collect index=`opencti_alerts_index` sourcetype="$sourcetype$" marker="$marker$"

# Source macros (expand here as you add more indexes)
[ip_event_sources]
definition = (index=zeek_conn)
iseval = 0

[domains_event_sources]
definition = (index=zeek_dns)
iseval = 0

# URL event sources
[url_event_sources]
definition = (index=zeek_http)
iseval = 0

[files_event_sources]
definition = (index=zeek_files)
iseval = 0

[# Email event sources]
[email_event_sources]
definition = (index=zeek_smtp)
iseval = 0

# Extract possible IPs (supports IPv4 + IPv6) — pipe-only (no semicolons)
[m_extract_ip_candidates]
definition = eval ip_candidates=mvappend('id.orig_h','id.resp_h',src,dest,src_ip,dest_ip,'source.ip','destination.ip') \
  | mvexpand ip_candidates \
  | eval ip=ip_candidates \
  | fields - ip_candidates \
  | where (cidrmatch("0.0.0.0/0", ip) OR cidrmatch("::/0", ip)) \
      AND NOT (
        cidrmatch("10.0.0.0/8", ip) \
        OR cidrmatch("172.16.0.0/12", ip) \
        OR cidrmatch("192.168.0.0/16", ip) \
        OR cidrmatch("127.0.0.0/8", ip) \
        OR cidrmatch("169.254.0.0/16", ip) \
        OR cidrmatch("::1/128", ip) \
        OR cidrmatch("fc00::/7", ip) \
        OR cidrmatch("fe80::/10", ip)
      )
iseval = 0

# Lookup helper macros (backend swappable in one place)
[m_opencti_lookup_domain(1)]
args = field
definition = lookup opencti_lookup_domain domain AS $field$ OUTPUTNEW domain AS ioc, score, labels, created_by, confidence

[m_opencti_lookup_ip(1)]
args = field
definition = lookup opencti_lookup_ip ip AS $field$ OUTPUTNEW ip AS ioc, score, labels, created_by, confidence

# URL lookup helper
[m_opencti_lookup_url(1)]
args = field
definition = lookup opencti_lookup_url url AS $field$ OUTPUTNEW url AS ioc, score, labels, created_by, confidence

# File hash lookup helper
[m_opencti_lookup_hash(1)]
args = field
definition = lookup opencti_lookup_hash hash AS $field$ OUTPUTNEW hash AS ioc, score, labels, created_by, confidence

# Email lookup helper
[m_opencti_lookup_email(1)]
args = field
definition = lookup opencti_lookup_email email AS $field$ OUTPUTNEW email AS ioc, score, labels, created_by, confidence

# Build email candidates from 'from' and 'to' fields; lowercase and basic validation
[m_extract_email_candidates]
definition = eval _email_candidates=mvappend(lower('from'),lower('to'),lower(mailfrom),lower(rcptto)) | mvexpand _email_candidates | eval email=trim(_email_candidates) | fields - _email_candidates | where isnotnull(email) AND email!="" AND match(email, "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$")
iseval = 0

# Build a URL candidate from the single 'url' field; lowercased; strip http/https scheme
[m_extract_url_candidates]
definition = eval url_candidate=lower(replace(url, "^https?://", "")) | where isnotnull(url_candidate) AND url_candidate!=""
iseval = 0

# Build file hash candidates from common fields; lowercase; keep only hex strings of typical lengths
[m_extract_file_hash_candidates]
definition = eval md5=lower(md5), sha1=lower(sha1), sha256=lower(sha256), hash=coalesce(sha256, sha1, md5, lower(file_hash), lower(hash)) | where isnotnull(hash) AND match(hash, "^(?:[0-9a-f]{64}|[0-9a-f]{40}|[0-9a-f]{32})$")
iseval = 0

# Index-time gating for NRT matchers (5-minute slice aligned to minute)
[m_index_time_gate]
definition = search _indextime>=relative_time(now(), "-5m@m") _indextime<relative_time(now(), "@m")
iseval = 0

# Optional: parameterized index-time gate
# Usage: `m_index_time_gate_window("-10m@m")`
[m_index_time_gate_window(1)]
args = window
definition = search _indextime>=relative_time(now(), $window$) _indextime<relative_time(now(), "@m")
iseval = 0

# Threat-match correlation runners (per IOC type)
# These macros centralize the SPL used by the engines. They are designed
# to be called from driver searches that read definitions from
# opencti_tm_monitored_indexs_and_fields and expand indexes/fields into
# $index_expr$ and $field_expr$ arguments. They also apply optional
# per-correlation exclusion logic (exclude_text / exclude_regex), which
# can be shared by both basic and regex-style correlations.

[m_otm_domain_correlation(5)]
args = correlation_name, index_expr, field_expr, exclude_text, exclude_regex
definition = search ($index_expr$) | `m_index_time_gate` | eval match_value_raw=lower($field_expr$), match_value=rtrim(match_value_raw,".") | eval exclude_text_raw=$exclude_text$, exclude_regex_raw=$exclude_regex$ | eval exclude_text_mv=if(isnull(exclude_text_raw) OR exclude_text_raw="", null(), split(exclude_text_raw, ",")), exclude_regex_mv=if(isnull(exclude_regex_raw) OR exclude_regex_raw="", null(), split(exclude_regex_raw, ",")) | eval exclude_text_clean=if(isnull(exclude_text_mv), null(), mvmap(exclude_text_mv, trim(exclude_text_mv))), exclude_regex_clean=if(isnull(exclude_regex_mv), null(), mvmap(exclude_regex_mv, trim(exclude_regex_mv))) | eval exclude_text_flags=if(isnull(exclude_text_clean), null(), mvmap(exclude_text_clean, if(exclude_text_clean="", 0, if(like(match_value_raw, "%" . exclude_text_clean . "%"), 1, 0)))), exclude_regex_flags=if(isnull(exclude_regex_clean), null(), mvmap(exclude_regex_clean, if(exclude_regex_clean="", 0, if(match(match_value_raw, exclude_regex_clean), 1, 0)))) | eval is_excluded=if(isnull(match_value_raw) OR match_value_raw="", 0, (coalesce(mvmax(exclude_text_flags),0) + coalesce(mvmax(exclude_regex_flags),0) > 0)) | where isnotnull(match_value) AND match_value!="" AND match(match_value, "^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$") AND is_excluded=0 | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY match_value | `m_opencti_lookup_domain(match_value)` | where isnotnull(ioc) | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="domain_match", correlation_name="$correlation_name$", _time=last_seen, alert_summary="domain=" . match_value . " IOC=" . ioc . " score=" . tostring(score) | fields match_value ioc score hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind correlation_name alert_summary | `m_collect_opencti_alerts("opencti:domain_match","domain_match")`
iseval = 0

