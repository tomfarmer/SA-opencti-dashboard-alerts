# Returns the alerts index name (easy to swap later if needed)
[opencti_alerts_index]
definition = opencti_alerts
iseval = 0

# Wraps collect so searches don't hardcode the index
# Usage: `m_collect_opencti_alerts("sourcetype","marker")`
[m_collect_opencti_alerts(2)]
args = sourcetype, marker
definition = collect index=`opencti_alerts_index` sourcetype="$sourcetype$" marker="$marker$"

# Lookup helper macros (backend swappable in one place)
[m_opencti_lookup_domain(1)]
args = field
definition = lookup opencti_lookup_domain domain AS $field$ OUTPUTNEW domain AS ioc, score, labels, created_by, confidence

[m_opencti_lookup_ip(1)]
args = field
definition = lookup opencti_lookup_ip ip AS $field$ OUTPUTNEW ip AS ioc, score, labels, created_by, confidence

# URL lookup helper
[m_opencti_lookup_url(1)]
args = field
definition = lookup opencti_lookup_url url AS $field$ OUTPUTNEW url AS ioc, score, labels, created_by, confidence

# File hash lookup helper
[m_opencti_lookup_hash(1)]
args = field
definition = lookup opencti_lookup_hash hash AS $field$ OUTPUTNEW hash AS ioc, score, labels, created_by, confidence

# Email lookup helper
[m_opencti_lookup_email(1)]
args = field
definition = lookup opencti_lookup_email email AS $field$ OUTPUTNEW email AS ioc, score, labels, created_by, confidence

# Index-time gating for NRT matchers (5-minute slice aligned to minute)
[opencti_tm_index_time_gate_window]
definition = "-5m@m"
iseval = 0

[m_index_time_gate]
definition = where _indextime>=relative_time(now(), `opencti_tm_index_time_gate_window`) AND _indextime<relative_time(now(), "@m")
iseval = 0

# Optional: parameterized index-time gate
# Usage: `m_index_time_gate_window("-10m@m")`
[m_index_time_gate_window(1)]
args = window
definition = where _indextime>=relative_time(now(), $window$) AND _indextime<relative_time(now(), "@m")
iseval = 0

# Threat-match correlation runners (per IOC type)
# These macros centralize the SPL used by the engines. They are designed
# to be called from driver searches that read definitions from
# opencti_tm_monitored_indexs_and_fields and expand indexes/fields into
# $index_expr$ and $field_expr$ arguments. They also apply optional
# per-correlation exclusion logic (exclude_text / exclude_regex), which
# can be shared by both basic and regex-style correlations.

[m_otm_domain_correlation(5)]
args = correlation_name, index_expr, field_expr, exclude_text, exclude_regex
definition = ($index_expr$) | `m_index_time_gate` | eval match_value_raw=lower($field_expr$), match_value=rtrim(match_value_raw,".") | eval exclude_text_raw=coalesce("$exclude_text$",""), exclude_regex_raw=coalesce("$exclude_regex$","") | eval exclude_text_mv=if(isnull(exclude_text_raw) OR exclude_text_raw="", null(), split(exclude_text_raw, ",")), exclude_regex_mv=if(isnull(exclude_regex_raw) OR exclude_regex_raw="", null(), split(exclude_regex_raw, ",")) | eval exclude_text_clean=if(isnull(exclude_text_mv), null(), mvmap(exclude_text_mv, trim(exclude_text_mv))), exclude_regex_clean=if(isnull(exclude_regex_mv), null(), mvmap(exclude_regex_mv, trim(exclude_regex_mv))) | eval exclude_text_flags=if(isnull(exclude_text_clean), null(), mvmap(exclude_text_clean, if(exclude_text_clean="", 0, if(like(match_value_raw, "%" . exclude_text_clean . "%"), 1, 0)))), exclude_regex_flags=if(isnull(exclude_regex_clean), null(), mvmap(exclude_regex_clean, if(exclude_regex_clean="", 0, if(match(match_value_raw, exclude_regex_clean), 1, 0)))) | eval is_excluded=if(isnull(match_value_raw) OR match_value_raw="", 0, if((coalesce(mvindex(mvsort(exclude_text_flags),-1),0) + coalesce(mvindex(mvsort(exclude_regex_flags),-1),0) > 0), 1, 0)) | where isnotnull(match_value) AND match_value!="" AND match(match_value, "^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$") AND is_excluded=0 | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY match_value | `m_opencti_lookup_domain(match_value)` | where isnotnull(ioc) | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="domain_match", correlation_name="$correlation_name$", _time=last_seen, alert_summary="domain=" . match_value . " IOC=" . ioc . " score=" . tostring(score) | fields _time match_value ioc score hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind correlation_name alert_summary | `m_collect_opencti_alerts("opencti:domain_match","domain_match")`
iseval = 0

[m_otm_ip_correlation(5)]
args = correlation_name, index_expr, field_expr, exclude_text, exclude_regex
definition = ($index_expr$) | `m_index_time_gate` | eval ip_candidates=mvappend($field_expr$,"") | mvexpand ip_candidates | eval ip=trim(ip_candidates) | fields - ip_candidates | `m_otm_ip_valid_public` | eval exclude_text_raw=coalesce("$exclude_text$",""), exclude_regex_raw=coalesce("$exclude_regex$","") | eval exclude_text_mv=if(isnull(exclude_text_raw) OR exclude_text_raw="", null(), split(exclude_text_raw, ",")), exclude_regex_mv=if(isnull(exclude_regex_raw) OR exclude_regex_raw="", null(), split(exclude_regex_raw, ",")) | eval exclude_text_clean=if(isnull(exclude_text_mv), null(), mvmap(exclude_text_mv, trim(exclude_text_mv))), exclude_regex_clean=if(isnull(exclude_regex_mv), null(), mvmap(exclude_regex_mv, trim(exclude_regex_mv))) | eval exclude_text_flags=if(isnull(exclude_text_clean), null(), mvmap(exclude_text_clean, if(exclude_text_clean="", 0, if(like(ip, "%" . exclude_text_clean . "%"), 1, 0)))), exclude_regex_flags=if(isnull(exclude_regex_clean), null(), mvmap(exclude_regex_clean, if(exclude_regex_clean="", 0, if(match(ip, exclude_regex_clean), 1, 0)))) | eval is_excluded=if(isnull(ip) OR ip="", 0, if((coalesce(mvindex(mvsort(exclude_text_flags),-1),0) + coalesce(mvindex(mvsort(exclude_regex_flags),-1),0) > 0), 1, 0)) | where is_excluded=0 | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY ip | `m_opencti_lookup_ip(ip)` | where isnotnull(ioc) | eval threat_feed_at_match_time=created_by | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="ip_match", correlation_name="$correlation_name$", _time=last_seen, alert_summary="IP=" . ip . " IOC=" . ioc . " score=" . tostring(score) | fields _time ip ioc score hits first_seen last_seen src_index src_sourcetype labels threat_feed_at_match_time confidence kind correlation_name alert_summary | `m_collect_opencti_alerts("opencti:ip_match","ip_match")`
iseval = 0

[m_otm_url_correlation(5)]
args = correlation_name, index_expr, field_expr, exclude_text, exclude_regex
definition = ($index_expr$) | `m_index_time_gate` | eval url_candidate_raw=lower($field_expr$), url_candidate=replace(url_candidate_raw, "^[a-z][a-z0-9+.-]*://", "") | eval exclude_text_raw=coalesce("$exclude_text$",""), exclude_regex_raw=coalesce("$exclude_regex$","") | eval exclude_text_mv=if(isnull(exclude_text_raw) OR exclude_text_raw="", null(), split(exclude_text_raw, ",")), exclude_regex_mv=if(isnull(exclude_regex_raw) OR exclude_regex_raw="", null(), split(exclude_regex_raw, ",")) | eval exclude_text_clean=if(isnull(exclude_text_mv), null(), mvmap(exclude_text_mv, trim(exclude_text_mv))), exclude_regex_clean=if(isnull(exclude_regex_mv), null(), mvmap(exclude_regex_mv, trim(exclude_regex_mv))) | eval exclude_text_flags=if(isnull(exclude_text_clean), null(), mvmap(exclude_text_clean, if(exclude_text_clean="", 0, if(like(url_candidate_raw, "%" . exclude_text_clean . "%"), 1, 0)))), exclude_regex_flags=if(isnull(exclude_regex_clean), null(), mvmap(exclude_regex_clean, if(exclude_regex_clean="", 0, if(match(url_candidate_raw, exclude_regex_clean), 1, 0)))) | eval is_excluded=if(isnull(url_candidate_raw) OR url_candidate_raw="", 0, if((coalesce(mvindex(mvsort(exclude_text_flags),-1),0) + coalesce(mvindex(mvsort(exclude_regex_flags),-1),0) > 0), 1, 0)) | where isnotnull(url_candidate) AND url_candidate!="" AND is_excluded=0 | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY url_candidate | `m_opencti_lookup_url(url_candidate)` | where isnotnull(ioc) | eval threat_feed_at_match_time=created_by | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="url_match", correlation_name="$correlation_name$", _time=last_seen, alert_summary="url=" . url_candidate . " IOC=" . ioc . " score=" . tostring(score) | fields _time url_candidate ioc score hits first_seen last_seen src_index src_sourcetype labels threat_feed_at_match_time confidence kind correlation_name alert_summary | `m_collect_opencti_alerts("opencti:url_match","url_match")`
iseval = 0

[m_otm_hash_correlation(5)]
args = correlation_name, index_expr, field_expr, exclude_text, exclude_regex
definition = ($index_expr$) | `m_index_time_gate` | eval hash_candidates=mvappend($field_expr$,"") | mvexpand hash_candidates | eval hash_raw=lower(trim(hash_candidates)), hash=hash_raw | fields - hash_candidates | eval exclude_text_raw=coalesce("$exclude_text$",""), exclude_regex_raw=coalesce("$exclude_regex$","") | eval exclude_text_mv=if(isnull(exclude_text_raw) OR exclude_text_raw="", null(), split(exclude_text_raw, ",")), exclude_regex_mv=if(isnull(exclude_regex_raw) OR exclude_regex_raw="", null(), split(exclude_regex_raw, ",")) | eval exclude_text_clean=if(isnull(exclude_text_mv), null(), mvmap(exclude_text_mv, trim(exclude_text_mv))), exclude_regex_clean=if(isnull(exclude_regex_mv), null(), mvmap(exclude_regex_mv, trim(exclude_regex_mv))) | eval exclude_text_flags=if(isnull(exclude_text_clean), null(), mvmap(exclude_text_clean, if(exclude_text_clean="", 0, if(like(hash_raw, "%" . exclude_text_clean . "%"), 1, 0)))), exclude_regex_flags=if(isnull(exclude_regex_clean), null(), mvmap(exclude_regex_clean, if(exclude_regex_clean="", 0, if(match(hash_raw, exclude_regex_clean), 1, 0)))) | eval is_excluded=if(isnull(hash_raw) OR hash_raw="", 0, if((coalesce(mvindex(mvsort(exclude_text_flags),-1),0) + coalesce(mvindex(mvsort(exclude_regex_flags),-1),0) > 0), 1, 0)) | where isnotnull(hash) AND match(hash, "^(?:[0-9a-f]{32}|[0-9a-f]{40}|[0-9a-f]{64})$") AND is_excluded=0 | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY hash | `m_opencti_lookup_hash(hash)` | where isnotnull(ioc) | eval threat_feed_at_match_time=created_by | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="file_hash_match", correlation_name="$correlation_name$", _time=last_seen, alert_summary="hash=" . hash . " IOC=" . ioc . " score=" . tostring(score) | fields _time hash ioc score hits first_seen last_seen src_index src_sourcetype labels threat_feed_at_match_time confidence kind correlation_name alert_summary | `m_collect_opencti_alerts("opencti:file_hash_match","file_hash_match")`
iseval = 0

