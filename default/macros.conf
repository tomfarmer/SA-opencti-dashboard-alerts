# IP validation + scope filters
# - Use `m_otm_ip_valid_any` to include private IPs (common in internal-only environments).
# - Use `m_otm_ip_valid_public` to exclude RFC1918/link-local/loopback.
[m_otm_ip_valid_any]
definition = where isnotnull(ip) AND ip!="" AND (cidrmatch("0.0.0.0/0", ip) OR cidrmatch("::/0", ip))
iseval = 0

[m_otm_ip_valid_public]
definition = where isnotnull(ip) AND ip!="" AND (cidrmatch("0.0.0.0/0", ip) OR cidrmatch("::/0", ip)) AND NOT (cidrmatch("0.0.0.0/8", ip) OR cidrmatch("10.0.0.0/8", ip) OR cidrmatch("100.64.0.0/10", ip) OR cidrmatch("127.0.0.0/8", ip) OR cidrmatch("169.254.0.0/16", ip) OR cidrmatch("172.16.0.0/12", ip) OR cidrmatch("192.168.0.0/16", ip) OR cidrmatch("224.0.0.0/4", ip) OR cidrmatch("240.0.0.0/4", ip) OR cidrmatch("255.255.255.255/32", ip) OR cidrmatch("::/128", ip) OR cidrmatch("::1/128", ip) OR cidrmatch("fc00::/7", ip) OR cidrmatch("fe80::/10", ip) OR cidrmatch("ff00::/8", ip))
iseval = 0

