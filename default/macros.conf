# Returns the alerts index name (easy to swap later if needed)
[opencti_alerts_index]
definition = opencti_alerts
iseval = 0

# Wraps collect so searches don't hardcode the index
# Usage: `m_collect_opencti_alerts("sourcetype","marker")`
[m_collect_opencti_alerts(2)]
args = sourcetype, marker
definition = collect index=`opencti_alerts_index` sourcetype="$sourcetype$" marker="$marker$"

# Source macros (expand here as you add more indexes)
[ip_event_sources]
definition = (index=zeek_conn)
iseval = 0

[dns_event_sources]
definition = (index=zeek_dns)
iseval = 0

[http_event_sources]
definition = (index=zeek_http)
iseval = 0

[files_event_sources]
definition = (index=zeek_files)
iseval = 0

# Extract possible IPs (supports IPv4 + IPv6) — pipe-only (no semicolons)
[m_extract_ip_candidates]
definition = eval ip_candidates=mvappend('id.orig_h','id.resp_h',src,dest,src_ip,dest_ip,'source.ip','destination.ip') | mvexpand ip_candidates | eval ip=ip_candidates | fields - ip_candidates | where cidrmatch("0.0.0.0/0", ip) OR cidrmatch("::/0", ip)
iseval = 0

# Lookup helper macros (backend swappable in one place)
[m_opencti_lookup_domain(1)]
args = field
definition = lookup opencti_lookup_domain domain AS $field$ OUTPUTNEW name AS ioc, score, labels, created_by, confidence

[m_opencti_lookup_ip(1)]
args = field
definition = lookup opencti_lookup_ip ip AS $field$ OUTPUTNEW name AS ioc, score, labels, created_by, confidence

# URL lookup helper
[m_opencti_lookup_url(1)]
args = field
definition = lookup opencti_lookup_url url AS $field$ OUTPUTNEW name AS ioc, score, labels, created_by, confidence

# File hash lookup helper
[m_opencti_lookup_hash(1)]
args = field
definition = lookup opencti_lookup_hash hash AS $field$ OUTPUTNEW hash AS ioc, score, labels, created_by, confidence

# Build a URL candidate (host+uri or url fields); lowercased; strip http(s) scheme
[m_extract_url_candidates]
definition = eval url_candidate=coalesce(url, uri, uri_path, request, http_request) \
 | eval url_candidate=if(isnotnull(host) AND isnotnull(uri), host.uri, url_candidate) \
 | eval url_candidate=if(isnotnull(host) AND isnotnull(uri_path), host.uri_path, url_candidate) \
 | eval url_candidate=lower(replace(url_candidate, "^https?://", "")) \
 | where isnotnull(url_candidate) AND url_candidate!=""
iseval = 0

# Build file hash candidates from common fields; lowercase; keep only hex strings of typical lengths
[m_extract_file_hash_candidates]
definition = eval md5=lower(md5), sha1=lower(sha1), sha256=lower(sha256), hash=coalesce(sha256, sha1, md5, lower(file_hash), lower(hash)) | where isnotnull(hash) AND match(hash, "^(?:[0-9a-f]{64}|[0-9a-f]{40}|[0-9a-f]{32})$")
iseval = 0
