[opencti_seenbefore_mark_cleared_domain]
label = OpenCTI: Mark Domain as Cleared
type = search
eventtypes = *
fields = domain,match_value
search.search_string = | inputlookup opencti_seenbefore_kv | search indicator="$@field_value$" type="domain" | append [ | makeresults count=1 | eval indicator="$@field_value$", type="domain", ioc_rating="unreviewed", cleared=0, note="" ] | head 1 | eval cleared=1, decided_at=now(), decided_by="$env:user$", _key=md5(type."|".indicator) | fields _key indicator type ioc_rating cleared decided_at decided_by note | outputlookup kvcoll://opencti_seenbefore_kv

