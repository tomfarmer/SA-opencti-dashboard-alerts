[opencti_seenbefore_mark_malicious_domain]
label = OpenCTI: Mark Domain as Malicious
type = search
eventtypes = *
fields = domain,match_value
search.search_string = | makeresults count=1 | eval indicator="$@field_value$", type="domain", ioc_rating="malicious", cleared=0, decided_at=now(), decided_by="$env:user$" | eval _key=md5(type."|".indicator) | outputlookup kvcoll://opencti_seenbefore_kv append=true

[opencti_seenbefore_mark_benign_domain]
