# Nightly rollup: global history per IOC (domain + IP)
[rollup_opencti_seenbefore_cache]
description = Global history (min(first_seen), max(last_seen), total_hits) per IOC
enableSched = 1
cron_schedule = 15 3 * * *
dispatch.earliest_time = -90d
dispatch.latest_time   = now
action.email = 0
search = search index=opencti_alerts sourcetype=opencti:domain_match earliest=-90d latest=now | eval indicator=coalesce(match_value, fqdn, domain, ioc), type="domain" | stats min(first_seen) as first_seen_all max(last_seen) as last_seen_all sum(hits) as total_hits_all by indicator type | append [ search index=opencti_alerts sourcetype=opencti:ip_match earliest=-90d latest=now | eval indicator=ip, type="ip" | stats min(first_seen) as first_seen_all max(last_seen) as last_seen_all sum(hits) as total_hits_all by indicator type ] | outputlookup opencti_seenbefore_cache.csv

# Optional: per‑IOC+feed history (disabled by default)
[rollup_opencti_threatfeed_history]
description = Threatfeed history per IOC (first/last seen per threatfeed)
enableSched = 1
cron_schedule = 30 * * * *
dispatch.earliest_time = -90d
dispatch.latest_time = now
search = | inputlookup opencti_lookup | eval v=lower(value), threatfeed=created_by, type=case(match(v,"^[a-z][a-z0-9+.-]*://.+") OR match(v,"^[A-Za-z0-9.-]+(:[0-9]+)?/.+"),"url", match(v,"^[0-9a-f]{32}$|^[0-9a-f]{40}$|^[0-9a-f]{64}$"),"hash", match(v,"^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"),"email", match(v,"^[0-9]{1,3}(?:\\.[0-9]{1,3}){3}(?:/\\d{1,2})?$|^[0-9A-Fa-f:]+(?:/\\d{1,3})?$"),"ip", 1=1,"domain") | eval ioc=case(type="url", replace(v, "^[a-z][a-z0-9+.-]*://", ""), type="domain", rtrim(v,"."), 1=1, v) | stats min(valid_from) as first_seen_threatfeed max(valid_until) as last_seen_threatfeed latest(score) as last_score latest(confidence) as last_confidence by ioc type threatfeed | outputlookup opencti_threatfeed_history

