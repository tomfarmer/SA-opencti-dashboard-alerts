# URL matcher (near-real-time)
[url_match_opencti]
description = Match URL events to OpenCTI URLs, write alerts
enableSched = 1
cron_schedule = 3-59/5 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
# single line (keep): legacy pipeline (before KV-driven correlations)
# search `url_event_sources` | `m_extract_url_candidates` | `m_opencti_lookup_url(url_candidate)` | where isnotnull(ioc) | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype values(labels) AS labels values(created_by) AS threat_feed_at_match_time latest(confidence) AS confidence BY url_candidate ioc score | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="url_match", _time=last_seen, alert_summary="url=" . url_candidate . " IOC=" . ioc . " score=" . tostring(score) | fields url_candidate ioc score hits first_seen last_seen src_index src_sourcetype labels threat_feed_at_match_time confidence kind alert_summary | `m_collect_opencti_alerts("opencti:url_match","url_match")`
search = | inputlookup opencti_tm_monitored_indexs_and_fields | where ioc_type="url" AND enabled=1 AND (isnull(correlation_mode) OR correlation_mode="basic") | eval name=_key | eval idx_mv=split(indexes,",") | eval index_expr=\"index=\" . mvjoin(idx_mv,\" OR index=\") | eval field_mv=split(fields,",") | eval field_expr=if(mvcount(field_mv)>1,\"coalesce(\" . mvjoin(field_mv,\",\") . \")\",mvindex(field_mv,0)) | map search=\"`m_otm_url_correlation(\\\"$name$\\\",\\\"$index_expr$\\\",$field_expr$,\\\"$exclude_text$\\\",\\\"$exclude_regex$\\\")`\" maxsearches=50

