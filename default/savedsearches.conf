search = search `dns_event_sources` | mvexpand answers | eval ip=answers | where cidrmatch("0.0.0.0/0", ip) OR cidrmatch("::/0", ip) | `m_opencti_lookup_ip(ip)` | where isnotnull(ioc) | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype values(labels) AS labels values(created_by) AS created_by latest(confidence) AS confidence BY ip ioc score | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="dns_answer_ip_match", _time=last_seen, alert_summary="answer_ip=" . ip . " IOC=" . ioc . " score=" . tostring(score) | fields ip ioc score hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind alert_summary | `m_collect_opencti_alerts("opencti:ip_match","ip_match")`

