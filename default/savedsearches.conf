# Refresh: materialize wildcard-capable domain patterns into KV
[refresh_opencti_domains_kv]
description = Derive wildcard-able domain patterns from opencti_lookup into KV
enableSched = 1
cron_schedule = 7-59/15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
# Steps:
# 1) Read master OpenCTI lookup (from the upstream app)
# 2) Normalize: lowercase and strip trailing dot
# 3) Keep domain-like values only
# 4) Generate TWO patterns per domain: "domain.com" and "*.domain.com"
# 5) Write to KV (overwrites content)
search = | inputlookup opencti_lookup | eval canonical=lower(value) | eval canonical=rtrim(canonical, ".") | where match(canonical, "^[A-Za-z0-9.-]+\.[A-Za-z]{2,}$") | eval domain_raw=canonical | eval domain_patterns=mvappend(domain_raw, "*.".domain_raw) | mvexpand domain_patterns | rename domain_patterns AS domain | table domain score labels created_by confidence | dedup domain | outputlookup opencti_lookup_domain

# Refresh: materialize CIDR-capable IP ranges (IPv4 + IPv6) into KV
[refresh_opencti_ips_kv]
description = Derive CIDR-capable IP ranges from opencti_lookup into KV (IPv4 + IPv6)
enableSched = 1
cron_schedule = 8-59/15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
# Steps:
# 1) Read master lookup
# 2) Normalize to lowercase
# 3) Detect IPv4/IPv6 (ensure IPv6 contains a colon to avoid matching hashes)
# 4) Convert single IPs: IPv4 -> /32, IPv6 -> /128
# 5) Dedup and write to KV (overwrites content)
search = | inputlookup opencti_lookup | eval value=lower(value) | eval is_cidr_v4=if(match(value, "^[0-9]{1,3}(?:\\.[0-9]{1,3}){3}/[0-9]{1,2}$"),1,0) | eval is_ip_v4=if(match(value, "^[0-9]{1,3}(?:\\.[0-9]{1,3}){3}$"),1,0) | eval is_cidr_v6=if(match(value, "^[0-9A-Fa-f:]+/[0-9]{1,3}$") AND like(value, "%:%"),1,0) | eval is_ip_v6=if(match(value, "^[0-9A-Fa-f:]+$") AND like(value, "%:%"),1,0) | where is_cidr_v4=1 OR is_ip_v4=1 OR is_cidr_v6=1 OR is_ip_v6=1 | eval ip=case(is_ip_v4=1, value."/32", is_ip_v6=1, value."/128", 1=1, value) | table ip score labels created_by confidence | dedup ip | outputlookup opencti_lookup_ip

# Matcher: configured domain fields vs OpenCTI domains (wildcard), writes to summary index
[domains_match_opencti]
description = Match configured domain fields to OpenCTI domains, write alerts
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time   = now
# Steps:
# 1) Read enabled domain correlation rows from the KV configuration.
# 2) Run each row against its configured indexes and fields.
# 3) Normalize candidate values and apply optional exclusions.
# 4) Lookup against domain KV, aggregate matches, and collect summaries.
search = | inputlookup opencti_tm_monitored_indexs_and_fields | where ioc_type="domain" AND enabled=1 AND (isnull(correlation_mode) OR correlation_mode="" OR correlation_mode="basic") | addinfo | eval earliest_clause=if(isnum(info_min_time) AND info_min_time>0, " earliest=" . tostring(round(info_min_time,0)), ""), latest_clause=if(isnum(info_max_time) AND info_max_time<2147483647, " latest=" . tostring(round(info_max_time,0)), "") | eval name=_key | eval idx_mv=split(indexes,",") | eval index_clause=earliest_clause . latest_clause | eval index_expr="index=" . mvjoin(idx_mv,index_clause . " OR index=") . index_clause | eval field_mv=split(fields,",") | eval quoted_mv=mvmap(field_mv, "'" . trim(field_mv) . "'") | eval field_expr=if(mvcount(quoted_mv)>1,"coalesce(" . mvjoin(quoted_mv,",") . ")",mvindex(quoted_mv,0)) | map search="search `m_otm_domain_correlation(\"$name$\",\"$index_expr$\",$field_expr$,\"$exclude_text$\",\"$exclude_regex$\")`" maxsearches=50

