# Matcher: configured IP sources vs OpenCTI IP/CIDR (IPv4 + IPv6), writes to summary index
[ip_match_opencti]
description = Match configured IP fields to OpenCTI IP/CIDR, write alerts
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time   = now
# Steps:
# 1) Read enabled IP correlation rows from the KV configuration.
# 2) Run each row against its configured indexes and fields.
# 3) Validate public IP candidates, lookup against IP KV, and collect summaries.
search = | inputlookup opencti_tm_monitored_indexs_and_fields | where ioc_type="ip" AND enabled=1 AND (isnull(correlation_mode) OR correlation_mode="" OR correlation_mode="basic") | addinfo | eval earliest_clause=if(isnum(info_min_time) AND info_min_time>0, " earliest=" . tostring(round(info_min_time,0)), ""), latest_clause=if(isnum(info_max_time) AND info_max_time<2147483647, " latest=" . tostring(round(info_max_time,0)), "") | eval name=_key | eval idx_mv=split(indexes,",") | eval index_clause=earliest_clause . latest_clause | eval index_expr="index=" . mvjoin(idx_mv,index_clause . " OR index=") . index_clause | eval field_mv=split(fields,",") | eval quoted_mv=mvmap(field_mv, "'" . trim(field_mv) . "'") | eval field_expr=if(mvcount(quoted_mv)>1,"mvappend(" . mvjoin(quoted_mv,",") . ")",mvindex(quoted_mv,0)) | map search="search `m_otm_ip_correlation(\"$name$\",\"$index_expr$\",$field_expr$,\"$exclude_text$\",\"$exclude_regex$\")`" maxsearches=50

