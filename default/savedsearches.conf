# single line (keep): search `domains_event_sources` | mvexpand answers | eval ip=answers | where (cidrmatch("0.0.0.0/0", ip) OR cidrmatch("::/0", ip)) AND NOT (cidrmatch("10.0.0.0/8", ip) OR cidrmatch("172.16.0.0/12", ip) OR cidrmatch("192.168.0.0/16", ip) OR cidrmatch("127.0.0.0/8", ip) OR cidrmatch("169.254.0.0/16", ip) OR cidrmatch("::1/128", ip) OR cidrmatch("fc00::/7", ip) OR cidrmatch("fe80::/10", ip)) | `m_opencti_lookup_ip(ip)` | where isnotnull(ioc) | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype values(labels) AS labels values(created_by) AS threat_feed_at_match_time latest(confidence) AS confidence BY ip ioc score | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="dns_answer_ip_match", _time=last_seen, alert_summary="answer_ip=" . ip . " IOC=" . ioc . " score=" . tostring(score) | fields ip ioc score hits first_seen last_seen src_index src_sourcetype labels threat_feed_at_match_time confidence kind alert_summary | `m_collect_opencti_alerts("opencti:ip_match","ip_match")`
search = search `domains_event_sources` | `m_index_time_gate` | mvexpand answers | eval ip=answers | where (cidrmatch("0.0.0.0/0", ip) OR cidrmatch("::/0", ip)) AND NOT (cidrmatch("10.0.0.0/8", ip) OR cidrmatch("172.16.0.0/12", ip) OR cidrmatch("192.168.0.0/16", ip) OR cidrmatch("127.0.0.0/8", ip) OR cidrmatch("169.254.0.0/16", ip) OR cidrmatch("::1/128", ip) OR cidrmatch("fc00::/7", ip) OR cidrmatch("fe80::/10", ip)) | `m_opencti_lookup_ip(ip)` | where isnotnull(ioc) | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype values(labels) AS labels values(created_by) AS created_by latest(confidence) AS confidence BY ip ioc score | lookup opencti_threatfeed_current_ip ioc OUTPUT threat_feed_current feed_scores | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="dns_answer_ip_match", _time=last_seen, alert_summary="answer_ip=" . ip . " IOC=" . ioc . " score=" . tostring(score) | eval threat_feed_at_match_time=coalesce(threat_feed_current, created_by) | fields ip ioc score hits first_seen last_seen src_index src_sourcetype labels threat_feed_at_match_time threat_feed_current feed_scores confidence kind alert_summary | `m_collect_opencti_alerts("opencti:ip_match","ip_match")`

