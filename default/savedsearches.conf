# Matcher: Email addresses vs OpenCTI emails (near-real-time), writes to summary index
[35_email_match_opencti]
description = Match email candidates to OpenCTI email IOCs, write alerts (NRT)
enableSched = 1
cron_schedule = 5-59/5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time   = now
# Steps (aggregate -> lookup -> filter -> collect):
# 1) Read email events via macro (adjustable indexes)
# 2) Extract candidates and compute role (sender/recipient)
# 3) Aggregate BY email+role to collapse duplicate events in the window
# 4) Lookup against email KV; keep only matches
# 5) Write normalized summary to opencti_alerts via collect macro
search = search `email_event_sources` \
  | `m_extract_email_candidates` \
  | eval from_l=lower(from), to_l=lower(to), mailfrom_l=lower(mailfrom), rcptto_l=lower(rcptto) \
  | eval role=case(email=from_l OR email=mailfrom_l, "sender", email=to_l OR email=rcptto_l, "recipient", 1=1, "unknown") \
  | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY email role \
  | lookup opencti_lookup_email email OUTPUT email AS ioc, score, labels, created_by, confidence \
  | where isnotnull(ioc) \
  | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="email_match", _time=last_seen, alert_summary="email=" . email . " role=" . role . " IOC=" . ioc . " score=" . tostring(score) \
  | fields email ioc score role hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind alert_summary _time \
  | `m_collect_opencti_alerts("opencti:email_match","email_match")`

