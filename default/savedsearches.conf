# Refresh: materialize wildcard-capable domain patterns into KV
[21_refresh_opencti_domains_kv]
description = Derive wildcard-able domain patterns from opencti_lookup into KV
enableSched = 1
cron_schedule = 7-59/15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
# Steps:
# 1) Read master OpenCTI lookup (from the upstream app)
# 2) Normalize: lowercase, strip scheme, strip trailing dot
# 3) Keep domain-like values only
# 4) Generate TWO patterns per domain: "domain.com" and "*.domain.com"
# 5) Write to KV (overwrites content)
search = | inputlookup opencti_lookup | eval name=lower(name) | eval name=replace(name, "^https?://", "") | eval name=rtrim(name,".") | where match(name, "^[A-Za-z0-9.-]+\.[A-Za-z]{2,}$") | eval domain_raw=name | eval domain_patterns=mvappend(domain_raw, "*.".domain_raw) | mvexpand domain_patterns | rename domain_patterns AS domain | table domain name score labels created_by confidence | dedup domain | outputlookup opencti_lookup_domain

# Refresh: materialize CIDR-capable IP ranges (IPv4 + IPv6) into KV
[22_refresh_opencti_ips_kv]
description = Derive CIDR-capable IP ranges from opencti_lookup into KV (IPv4 + IPv6)
enableSched = 1
cron_schedule = 8-59/15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
# Steps:
# 1) Read master lookup
# 2) Normalize to lowercase
# 3) Detect IPv4/IPv6 (ensure IPv6 contains a colon to avoid matching hashes)
# 4) Convert single IPs: IPv4 -> /32, IPv6 -> /128
# 5) Dedup and write to KV (overwrites content)
search = | inputlookup opencti_lookup | eval name=lower(name) | eval is_cidr_v4=if(match(name, "^[0-9]{1,3}(?:\\.[0-9]{1,3}){3}/[0-9]{1,2}$"),1,0) | eval is_ip_v4=if(match(name, "^[0-9]{1,3}(?:\\.[0-9]{1,3}){3}$"),1,0) | eval is_cidr_v6=if(match(name, "^[0-9A-Fa-f:]+/[0-9]{1,3}$") AND like(name, "%:%"),1,0) | eval is_ip_v6=if(match(name, "^[0-9A-Fa-f:]+$") AND like(name, "%:%"),1,0) | where is_cidr_v4=1 OR is_ip_v4=1 OR is_cidr_v6=1 OR is_ip_v6=1 | eval ip=case(is_ip_v4=1, name."/32", is_ip_v6=1, name."/128", 1=1, name) | table ip name score labels created_by confidence | dedup ip | outputlookup opencti_lookup_ip

# Matcher: DNS (queries + answers) vs OpenCTI domains (wildcard), writes to summary index
[30_dns_match_opencti]
description = Match DNS (queries + answers) to OpenCTI domains, write alerts
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time   = now
# Steps:
# 1) Read DNS events via macro (adjustable indexes)
# 2) Normalize query, prepare a candidate field for matching
# 3) Also expand DNS answers, normalize, and mark source field
# 4) Lookup against domain KV (macro), keep only matches
# 5) Aggregate to first/last seen + hits
# 6) Collect to summary (macro wraps collect target)
# single line (keep): search `dns_event_sources` | eval match_value=lower(rtrim(query,".")), matched_field="query" | appendpipe [ mvexpand answers | eval match_value=lower(rtrim(answers,".")), matched_field="answer" ] | where isnotnull(match_value) AND match_value!="" AND match(match_value, "^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$") | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY match_value matched_field | `m_opencti_lookup_domain(match_value)` | where isnotnull(ioc) | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="dns_match", _time=last_seen, alert_summary="domain=" . match_value . " field=" . matched_field . " IOC=" . ioc . " score=" . tostring(score) | fields match_value matched_field ioc score hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind alert_summary | `m_collect_opencti_alerts("opencti:dns_match","dns_match")`
search = search `dns_event_sources` | eval match_value=lower(rtrim(query,".")), matched_field="query" | appendpipe [ mvexpand answers | eval match_value=lower(rtrim(answers,".")), matched_field="answer" ] | where isnotnull(match_value) AND match_value!="" AND match(match_value, "^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$") | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype BY match_value matched_field | `m_opencti_lookup_domain(match_value)` | where isnotnull(ioc) | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="dns_match", _time=last_seen, alert_summary="domain=" . match_value . " field=" . matched_field . " IOC=" . ioc . " score=" . tostring(score) | fields match_value matched_field ioc score hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind alert_summary | `m_collect_opencti_alerts("opencti:dns_match","dns_match")`

# Matcher: any IP sources vs OpenCTI IP/CIDR (IPv4 + IPv6), writes to summary index
[31_ip_match_opencti]
description = Match any IPs from ip_event_sources to OpenCTI IP/CIDR, write alerts
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time   = now
# Steps:
# 1) Read events from IP sources via macro
# 2) Extract candidate IPs (macro normalizes and filters valid v4/v6)
# 3) Lookup against IP KV (macro), keep only matches
# 4) Aggregate and write to summary
# single line (keep): search `ip_event_sources` | `m_extract_ip_candidates` | `m_opencti_lookup_ip(ip)` | where isnotnull(ioc) | eval role=case(ip='id.orig_h',"src", ip='id.resp_h',"dest", ip=src OR ip=src_ip OR ip='source.ip',"src", ip=dest OR ip=dest_ip OR ip='destination.ip',"dest", 1=1,"unknown") | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype values(labels) AS labels latest(created_by) AS created_by latest(confidence) AS confidence by ip ioc score role | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="ip_match", _time=last_seen, alert_summary="IP=" . ip . " role=" . role . " IOC=" . ioc . " score=" . tostring(score) | fields ip ioc score role hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind alert_summary | `m_collect_opencti_alerts("opencti:ip_match","ip_match")`
search = search `ip_event_sources` | `m_extract_ip_candidates` | `m_opencti_lookup_ip(ip)` | where isnotnull(ioc) | eval role=case(ip='id.orig_h',"src", ip='id.resp_h',"dest", ip=src OR ip=src_ip OR ip='source.ip',"src", ip=dest OR ip=dest_ip OR ip='destination.ip',"dest", 1=1,"unknown") | stats count AS hits earliest(_time) AS first_seen latest(_time) AS last_seen latest(index) AS src_index latest(sourcetype) AS src_sourcetype values(labels) AS labels values(created_by) AS created_by latest(confidence) AS confidence by ip ioc score role | eval src_index=coalesce(src_index, replace(replace(src_sourcetype, ":json$", ""), ":", "_")), kind="ip_match", _time=last_seen, alert_summary="IP=" . ip . " role=" . role . " IOC=" . ioc . " score=" . tostring(score) | fields ip ioc score role hits first_seen last_seen src_index src_sourcetype labels created_by confidence kind alert_summary | `m_collect_opencti_alerts("opencti:ip_match","ip_match")`

