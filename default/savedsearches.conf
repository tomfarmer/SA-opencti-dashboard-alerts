[32_dns_answer_ip_match_opencti]
description = Match DNS answers that are IPs to OpenCTI IP/CIDR, write alerts
enableSched = 1
cron_schedule = 2-59/5 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
# 1) Read DNS via macro, expand answers
