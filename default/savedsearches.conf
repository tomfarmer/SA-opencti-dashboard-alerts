# URL matcher (near-real-time)
[url_match_opencti]
description = Match URL events to OpenCTI URLs, write alerts
enableSched = 1
cron_schedule = 3-59/5 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
search = | inputlookup opencti_tm_monitored_indexs_and_fields | where ioc_type="url" AND enabled=1 AND (isnull(correlation_mode) OR correlation_mode="" OR correlation_mode="basic") | addinfo | eval earliest_clause=if(isnum(info_min_time) AND info_min_time>0, " earliest=" . tostring(round(info_min_time,0)), ""), latest_clause=if(isnum(info_max_time) AND info_max_time<2147483647, " latest=" . tostring(round(info_max_time,0)), "") | eval name=_key | eval idx_mv=split(indexes,",") | eval index_clause=earliest_clause . latest_clause | eval index_expr="index=" . mvjoin(idx_mv,index_clause . " OR index=") . index_clause | eval field_mv=split(fields,",") | eval quoted_mv=mvmap(field_mv, "'" . trim(field_mv) . "'") | eval field_expr=if(mvcount(quoted_mv)>1,"coalesce(" . mvjoin(quoted_mv,",") . ")",mvindex(quoted_mv,0)) | map search="`m_otm_url_correlation(\"$name$\",\"$index_expr$\",$field_expr$,\"$exclude_text$\",\"$exclude_regex$\")`" maxsearches=50

