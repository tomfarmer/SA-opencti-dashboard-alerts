# Threat-feed union — current producers per IOC (hourly)
[refresh_threatfeed_current_domain]
description = Build union of producers for domains (current)
enableSched = 1
cron_schedule = 12 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = | inputlookup opencti_lookup | eval v=lower(value) | eval v=rtrim(v, ".") | where match(v, "^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$") | rename v AS ioc | stats max(score) AS score_by_feed BY ioc created_by | eval feed_score_pair=created_by.":".tostring(score_by_feed) | stats values(created_by) AS threat_feed_current values(feed_score_pair) AS feed_scores max(score_by_feed) AS max_score min(score_by_feed) AS min_score BY ioc | eval score_range=min_score . "–" . max_score | table ioc threat_feed_current feed_scores max_score min_score score_range | outputlookup opencti_threatfeed_current_domain

[refresh_threatfeed_current_ip]
description = Build union of producers for IPs/CIDR (current)
enableSched = 1
cron_schedule = 13 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = | inputlookup opencti_lookup | eval v=lower(value) | eval is_cidr_v4=if(match(v, "^[0-9]{1,3}(?:\\.[0-9]{1,3}){3}/[0-9]{1,2}$"),1,0) | eval is_ip_v4=if(match(v, "^[0-9]{1,3}(?:\\.[0-9]{1,3}){3}$"),1,0) | eval is_cidr_v6=if(match(v, "^[0-9A-Fa-f:]+/[0-9]{1,3}$") AND like(v, "%:%"),1,0) | eval is_ip_v6=if(match(v, "^[0-9A-Fa-f:]+$") AND like(v, "%:%"),1,0) | where is_cidr_v4=1 OR is_ip_v4=1 OR is_cidr_v6=1 OR is_ip_v6=1 | eval ioc=case(is_ip_v4=1, v."/32", is_ip_v6=1, v."/128", 1=1, v) | stats max(score) AS score_by_feed BY ioc created_by | eval feed_score_pair=created_by.":".tostring(score_by_feed) | stats values(created_by) AS threat_feed_current values(feed_score_pair) AS feed_scores max(score_by_feed) AS max_score min(score_by_feed) AS min_score BY ioc | eval score_range=min_score . "–" . max_score | table ioc threat_feed_current feed_scores max_score min_score score_range | outputlookup opencti_threatfeed_current_ip

