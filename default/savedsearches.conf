dispatch.latest_time = now
search = | inputlookup opencti_tm_monitored_indexs_and_fields | where ioc_type="domain" AND enabled=1 AND (isnull(correlation_mode) OR correlation_mode="" OR correlation_mode="basic") | addinfo | eval earliest_clause=if(isnum(info_min_time) AND info_min_time>0, " earliest=" . tostring(round(info_min_time,0)), ""), latest_clause=if(isnum(info_max_time) AND info_max_time<2147483647, " latest=" . tostring(round(info_max_time,0)), "") | eval name=_key | eval idx_mv=split(indexes,",") | eval index_clause=earliest_clause . latest_clause | eval index_expr="index=" . mvjoin(idx_mv,index_clause . " OR index=") . index_clause | eval field_mv=split(fields,",") | eval quoted_mv=mvmap(field_mv, "'" . trim(field_mv) . "'") | eval field_expr=if(mvcount(quoted_mv)>1,"coalesce(" . mvjoin(quoted_mv,",") . ")",mvindex(quoted_mv,0)) | map search="search ($index_expr$) | `m_index_time_gate` | eval correlation_name=\"$name$\" | eventstats count AS raw_events | eval match_value_raw=lower($field_expr$), match_value=rtrim(match_value_raw,\".\") | where isnotnull(match_value) AND match_value!=\"\" AND like(match_value,\"%.__%\") | `m_opencti_lookup_domain(match_value)` | eval is_match=if(isnotnull(ioc),1,0) | stats max(raw_events) AS raw_events count AS candidate_rows dc(match_value) AS unique_domains sum(is_match) AS matched_rows dc(eval(if(is_match=1,ioc,null()))) AS unique_iocs values(eval(if(is_match=1,match_value,null()))) AS example_matched_domains BY correlation_name index sourcetype | eval example_matched_domains=mvindex(example_matched_domains,0)" maxsearches=50

