[opencti_domains_kv]         # KV Store "table" for domain patterns
enforceTypes = true
field.domain = string        # will hold patterns like "evil.com" and "*.evil.com"
field.name = string          # original IOC value from opencti (for reference)
field.score = number         # risk score if you have one
field.labels = string        # CSV or JSON-ish labels/tags
field.created_by = string    # source/producer of IOC (if available)
field.confidence = number    # confidence from OpenCTI (if available)

[opencti_ips_kv]             # KV Store "table" for IP/CIDR patterns
enforceTypes = true
field.ip = string            # "1.2.3.4/32" or "10.0.0.0/8"
field.name = string
field.score = number
field.labels = string
field.created_by = string
field.confidence = number

# URLs: full host/path strings (scheme stripped), wildcard-capable
[opencti_urls_kv]
enforceTypes = true
field.url = string           # e.g., "example.com/login", "sub.example.com/*"
field.name = string
field.score = number
field.labels = string
field.created_by = string
field.confidence = number

# File hashes: exact match on hash value (md5/sha1/sha256)
[opencti_hashes_kv]
enforceTypes = true
field.hash = string          # lowercase hex string
field.name = string
field.score = number
field.labels = string
field.created_by = string
field.confidence = number

# Analyst seen-before status per indicator (domain or IP)
[opencti_seenbefore_kv]
enforceTypes = true
field._key = string          # md5(type|indicator) — used for upsert
field.indicator = string     # normalized domain or IP
field.type = string          # "domain" | "ip"
field.ioc_rating = string    # "malicious" | "benign" | "unreviewed"
field.decided_at = number    # epoch seconds
field.decided_by = string    # username
field.note = string          # optional analyst note
