# Domains: use wildcard matching (so "*.evil.com" matches "a.b.evil.com")
[opencti_lookup_domain]
collection = opencti_domains_kv
external_type = kvstore
case_sensitive_match = false
match_type = WILDCARD(domain)
fields_list = domain,score,labels,created_by,confidence

# IPs/CIDRs: use network-aware matching (so "10.0.0.0/8" matches "10.1.2.3")
[opencti_lookup_ip]
collection = opencti_ips_kv
external_type = kvstore
case_sensitive_match = false
match_type = CIDR(ip)
fields_list = ip,score,labels,created_by,confidence

# Seen-before KV lookup
[opencti_seenbefore_kv]
collection = opencti_seenbefore_kv
external_type = kvstore
fields_list = _key,indicator,type,ioc_rating,cleared,decided_at,decided_by,note

# Seen cache CSV lookup (global history)
[opencti_seenbefore_cache]
filename = opencti_seenbefore_cache.csv
case_sensitive_match = false
fields_list = indicator,type,first_seen_all,last_seen_all,total_hits_all

# URLs: WILDCARD(url) so patterns like "*.example.com/*" match
[opencti_lookup_url]
collection = opencti_urls_kv
external_type = kvstore
case_sensitive_match = false
match_type = WILDCARD(url)
fields_list = url,score,labels,created_by,confidence

# File hashes: exact match on hash value
[opencti_lookup_hash]
collection = opencti_hashes_kv
external_type = kvstore
case_sensitive_match = false
fields_list = hash,score,labels,created_by,confidence

# Emails: exact match on full email address
[opencti_lookup_email]
collection = opencti_emails_kv
external_type = kvstore
case_sensitive_match = false
fields_list = email,score,labels,created_by,confidence

# Threat-feed union lookups (exact match on IOC)
# Note: outputlookup must target the lookup definition below.
# For example, "| outputlookup opencti_threatfeed_current_domain" writes to
# the KV Store collection "threatfeed_current_domain_kv" via this transform.
[opencti_threatfeed_current_domain]
collection = threatfeed_current_domain_kv
external_type = kvstore
case_sensitive_match = false
fields_list = ioc,threat_feed_current,feed_scores,max_score,min_score,score_range

[opencti_threatfeed_current_ip]
collection = threatfeed_current_ip_kv
external_type = kvstore
case_sensitive_match = false
fields_list = ioc,threat_feed_current,feed_scores,max_score,min_score,score_range

[opencti_threatfeed_current_url]
collection = threatfeed_current_url_kv
external_type = kvstore
case_sensitive_match = false
fields_list = ioc,threat_feed_current,feed_scores,max_score,min_score,score_range

[opencti_threatfeed_current_hash]
collection = threatfeed_current_hash_kv
external_type = kvstore
case_sensitive_match = false
fields_list = ioc,threat_feed_current,feed_scores,max_score,min_score,score_range

[opencti_threatfeed_current_email]
collection = threatfeed_current_email_kv
external_type = kvstore
case_sensitive_match = false
fields_list = ioc,threat_feed_current,feed_scores,max_score,min_score,score_range

# Optional feed-history CSV (per IOC + feed timeline)
[opencti_threatfeed_history]
filename = opencti_threatfeed_history.csv
case_sensitive_match = false
fields_list = ioc,type,feed,first_seen_feed,last_seen_feed,last_score,last_confidence

[opencti_tm_monitored_indexs_and_fields]
collection = opencti_tm_monitored_indexs_and_fields
external_type = kvstore
fields_list = _key,description,ioc_type,indexes,fields,enabled,last_updated,created_by,correlation_mode,regex_pattern,exclude_regex
