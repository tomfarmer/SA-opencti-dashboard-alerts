# The index your correlation/alerts will be written to
[opencti_alerts]
homePath   = $SPLUNK_DB/opencti_alerts/db          # Hot/warm path on THIS host (your Search Head)
coldPath   = $SPLUNK_DB/opencti_alerts/colddb      # Cold path on THIS host
thawedPath = $SPLUNK_DB/opencti_alerts/thaweddb    # Where you'd "thaw" archived buckets if needed

# Retention: keep data up to 365 days AND up to 500 GB (first limit wins)
frozenTimePeriodInSecs = 31536000
maxTotalDataSizeMB     = 512000
